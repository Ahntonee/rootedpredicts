<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predictions | Rooted Predictions Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="admin-sidebar" class="admin-sidebar"></div>
<div class="admin-topbar">
  <span class="admin-topbar-title">Manage Predictions</span>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-outline btn-sm" id="score-all-btn" title="Run algorithm on all pending predictions"><span class="material-icons-round">auto_awesome</span>Score All</button>
    <button class="btn btn-primary btn-sm" id="new-pred-btn"><span class="material-icons-round">add</span>New Prediction</button>
  </div>
</div>
<main class="admin-main">
  <div class="admin-table-header">
    <div class="admin-filters">
      <select class="admin-filter-select" id="f-result"><option value="">All Results</option><option value="pending">Pending</option><option value="won">Won</option><option value="lost">Lost</option></select>
      <select class="admin-filter-select" id="f-visibility"><option value="">All Visibility</option><option value="free">Free</option><option value="vip">VIP</option></select>
      <input type="date" class="admin-filter-select" id="f-date">
    </div>
    <button class="btn btn-outline btn-sm" id="apply-filters"><span class="material-icons-round">filter_list</span>Apply</button>
  </div>
  <div class="card" style="overflow:hidden;">
    <div id="pred-loading" style="text-align:center;padding:40px;"><span class="material-icons-round" style="font-size:2rem;color:var(--border);display:block;margin-bottom:8px;">hourglass_empty</span><p style="color:var(--muted);">Loading...</p></div>
    <div id="pred-table" style="display:none;overflow-x:auto;">
      <table class="leaderboard-table">
        <thead><tr><th>Match</th><th>League</th><th>Tip</th><th>Market</th><th>Confidence</th><th>Visibility</th><th>Result</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody id="pred-tbody"></tbody>
      </table>
    </div>
  </div>
  <div id="pred-pagination" style="display:none;justify-content:center;gap:8px;margin-top:16px;align-items:center;">
    <button id="p-prev" class="btn btn-outline btn-sm" disabled><span class="material-icons-round">chevron_left</span></button>
    <span id="p-info" style="font-size:0.85rem;color:var(--muted);"></span>
    <button id="p-next" class="btn btn-outline btn-sm"><span class="material-icons-round">chevron_right</span></button>
  </div>
</main>

<!-- Create/Edit Modal -->
<div id="pred-modal" class="admin-modal-overlay" style="display:none;">
  <div class="admin-modal">
    <div class="admin-modal-header">
      <span class="admin-modal-title" id="modal-title">New Prediction</span>
      <button class="admin-close-btn" onclick="Admin.hideModal('pred-modal')"><span class="material-icons-round">close</span></button>
    </div>
    <div class="admin-modal-body">
      <input type="hidden" id="edit-id">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group" style="margin:0;"><label class="form-label">League</label><select class="form-control" id="m-league"><option value="">Select a league…</option></select></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Match Date</label><input type="datetime-local" class="form-control" id="m-date"></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Home Team</label><select class="form-control" id="m-home"><option value="">Select a league first…</option></select></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Away Team <span style="font-weight:400;color:var(--muted);font-size:0.72rem;">(auto-fills from fixture)</span></label><select class="form-control" id="m-away"><option value="">Auto-fills from fixture</option></select></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Tip</label><input type="text" class="form-control" id="m-tip" placeholder="e.g. Home Win, Over 2.5"></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Market</label>
          <select class="form-control" id="m-market"><option>1X2</option><option>Over/Under</option><option>BTTS</option><option>Correct Score</option><option>Draw No Bet</option><option>Accumulator</option></select>
        </div>
        <div class="form-group" style="margin:0;"><label class="form-label">Odds <span style="font-weight:400;color:var(--muted);font-size:0.72rem;">(per market)</span></label><div id="odds-fields" style="display:flex;gap:6px;"></div><input type="hidden" id="m-odds"></div>
        <div class="form-group" style="margin:0;">
          <label class="form-label" style="display:flex;align-items:center;justify-content:space-between;">
            Confidence (0-100)
            <button type="button" id="auto-score-btn" class="btn btn-outline btn-sm" style="padding:2px 8px;font-size:0.72rem;" title="Calculate score from form, H2H and odds">
              <span class="material-icons-round" style="font-size:0.8rem;">auto_awesome</span>Auto-Score
            </button>
          </label>
          <input type="number" min="0" max="100" class="form-control" id="m-conf" placeholder="Click Auto-Score or enter manually">
        </div>
        <div class="form-group" style="margin:0;"><label class="form-label">Visibility</label>
          <select class="form-control" id="m-vis"><option value="free">Free</option><option value="vip">VIP</option></select>
        </div>
        <div class="form-group" style="margin:0;"><label class="form-label">Result</label>
          <select class="form-control" id="m-result"><option value="pending">Pending</option><option value="won">Won</option><option value="lost">Lost</option><option value="void">Void</option></select>
        </div>
        <div class="form-group" style="margin:0;grid-column:1/-1;"><label class="form-label">Expert Analysis</label><textarea class="form-control" id="m-analysis" rows="3" placeholder="Optional match analysis..."></textarea></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Home Form</label><input type="text" class="form-control" id="m-hform" placeholder="e.g. WWDLW"></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Away Form</label><input type="text" class="form-control" id="m-aform" placeholder="e.g. LWWWD"></div>
        <div class="form-group" style="margin:0;grid-column:1/-1;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;-webkit-user-select:text;user-select:text;">
            <input type="checkbox" id="m-published"> <span class="form-label" style="margin:0;">Publish immediately</span>
          </label>
        </div>
      </div>
    </div>
    <div class="admin-modal-footer">
      <button class="btn btn-outline btn-sm" onclick="Admin.hideModal('pred-modal')">Cancel</button>
      <button class="btn btn-primary btn-sm" id="save-pred-btn"><span class="material-icons-round">save</span>Save Prediction</button>
    </div>
  </div>
</div>

<!-- Research Modal -->
<div id="research-modal" class="admin-modal-overlay" style="display:none;">
  <div class="admin-modal" style="max-width:780px;width:96vw;">
    <div class="admin-modal-header">
      <span class="admin-modal-title" id="research-title">Match Research</span>
      <button class="admin-close-btn" onclick="Admin.hideModal('research-modal')"><span class="material-icons-round">close</span></button>
    </div>
    <div class="admin-modal-body" id="research-body" style="max-height:75vh;overflow-y:auto;">
      <div id="research-loading" style="text-align:center;padding:40px;">
        <span class="material-icons-round" style="font-size:2.5rem;color:var(--border);display:block;margin-bottom:8px;animation:spin 1s linear infinite;">refresh</span>
        <p style="color:var(--muted);">Fetching live data from API-Football...</p>
        <p style="color:var(--muted);font-size:0.78rem;margin-top:6px;">Form, H2H, standings, stats — may take 5-10 seconds</p>
      </div>
      <div id="research-content" style="display:none;"></div>
    </div>
    <div class="admin-modal-footer" id="research-footer" style="display:none;">
      <button class="btn btn-outline btn-sm" onclick="Admin.hideModal('research-modal')">Close</button>
      <button class="btn btn-primary btn-sm" id="apply-suggestion-btn"><span class="material-icons-round">auto_awesome</span>Apply Suggestion to Edit Form</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
<script>
const theme = localStorage.getItem('afro_theme')||'dark';
document.documentElement.setAttribute('data-theme',theme);
let predPage = 1;

// Add spin animation for loading states
(function(){ const s=document.createElement('style'); s.textContent='@keyframes spin{to{transform:rotate(360deg)}}'; document.head.appendChild(s); })();

function describeScore(s) {
  if (s >= 80) return 'Very High Confidence';
  if (s >= 65) return 'High Confidence';
  if (s >= 50) return 'Moderate Confidence';
  if (s >= 35) return 'Low Confidence';
  return 'Speculative';
}

async function loadPredictions(page) {
  page = page||1;
  const result     = document.getElementById('f-result').value;
  const visibility = document.getElementById('f-visibility').value;
  const date       = document.getElementById('f-date').value;
  let url = `/api/admin/predictions?page=${page}&limit=20`;
  if (result)     url += '&result='+result;
  if (visibility) url += '&visibility='+visibility;
  if (date)       url += '&date='+date;
  document.getElementById('pred-loading').style.display='block';
  document.getElementById('pred-table').style.display='none';
  const json = await Admin.api('GET', url);
  document.getElementById('pred-loading').style.display='none';
  if (!json.success) return;
  const d = json.data;
  document.getElementById('pred-table').style.display='block';
  document.getElementById('pred-tbody').innerHTML = d.predictions.map(p => `
    <tr>
      <td><div style="font-weight:600;font-size:0.85rem;">${p.home_team} vs ${p.away_team}</div></td>
      <td style="font-size:0.8rem;color:var(--muted);">${p.league_name||'—'}</td>
      <td style="font-weight:600;color:var(--red);font-size:0.85rem;">${p.tip||'TBD'}</td>
      <td style="font-size:0.8rem;">${p.market}</td>
      <td>${p.confidence_score ? p.confidence_score+'%' : '—'}</td>
      <td>${Admin.badge(p.visibility)}</td>
      <td>${Admin.badge(p.result)}</td>
      <td style="font-size:0.78rem;color:var(--muted);">${Admin.fmtDate(p.match_date)}</td>
      <td>
        <div style="display:flex;gap:4px;">
          ${p.fixture_id ? `<button onclick="researchPred(${p.fixture_id},'${p.home_team} vs ${p.away_team}')" class="btn btn-sm" style="padding:4px 8px;background:rgba(59,130,246,0.1);color:#3b82f6;border:1px solid rgba(59,130,246,0.2);" title="Research match data"><span class="material-icons-round" style="font-size:0.9rem;">insights</span></button>` : ''}
          <button onclick="editPred(${p.id})" class="btn btn-outline btn-sm" style="padding:4px 8px;"><span class="material-icons-round" style="font-size:0.9rem;">edit</span></button>
          <button onclick="deletePred(${p.id})" class="btn btn-sm" style="padding:4px 8px;background:rgba(233,69,96,0.1);color:var(--red);border:1px solid rgba(233,69,96,0.2);"><span class="material-icons-round" style="font-size:0.9rem;">delete</span></button>
        </div>
      </td>
    </tr>`).join('');
  const total = d.total; const limit = d.limit; const pages = Math.ceil(total/limit);
  if (pages>1) {
    document.getElementById('pred-pagination').style.display='flex';
    document.getElementById('p-info').textContent='Page '+page+' of '+pages+' ('+total+' total)';
    document.getElementById('p-prev').disabled=(page<=1);
    document.getElementById('p-next').disabled=(page>=pages);
  }
}

let editingId = null;
function openNewModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'New Prediction';
  document.getElementById('edit-id').value = '';
  ['m-tip','m-conf','m-analysis','m-hform','m-aform','m-date','m-odds'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('m-league').value = '';
  document.getElementById('m-market').value = '1X2';
  document.getElementById('m-vis').value = 'free';
  document.getElementById('m-result').value = 'pending';
  document.getElementById('m-published').checked = false;
  renderOddsFields('1X2');
  loadLeagueFixtures();   // resets team dropdowns to "select a league first"
  Admin.showModal('pred-modal');
}

// ── Market-specific odds fields ────────────────────────────────────────────
const ODDS_FIELDS = {
  '1X2':          [['home','Home'], ['draw','Draw'], ['away','Away']],
  'BTTS':         [['yes','Yes'],   ['no','No']],
  'Over/Under':   [['over','Over'], ['under','Under']],
  'Draw No Bet':  [['home','Home'], ['away','Away']],
  'Correct Score':[['odds','Odds']],
  'Accumulator':  [['odds','Odds']],
};
function oddsFieldsFor(market) { return ODDS_FIELDS[market] || [['odds','Odds']]; }

function renderOddsFields(market, data) {
  if (typeof data === 'string') { try { data = JSON.parse(data); } catch (_) { data = {}; } }
  data = data || {};
  document.getElementById('odds-fields').innerHTML = oddsFieldsFor(market).map(([key, label]) => `
    <div style="flex:1;min-width:0;text-align:center;">
      <input type="number" step="0.01" min="1" class="form-control odds-input" data-key="${key}"
             placeholder="${label}" value="${data[key] != null ? data[key] : ''}"
             style="padding:7px;font-size:0.85rem;text-align:center;">
      <div style="font-size:0.64rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em;">${label}</div>
    </div>`).join('');
}

// Which odds field corresponds to the chosen tip (so we store the right primary odds)
function tipToOddsKey(tip, market) {
  const t = (tip || '').toLowerCase();
  if (market === '1X2' || market === 'Draw No Bet') {
    if (t.includes('home') || t === '1') return 'home';
    if (t.includes('away') || t === '2') return 'away';
    if (t.includes('draw') || t === 'x') return 'draw';
  }
  if (market === 'BTTS')       return t.includes('no') ? 'no' : 'yes';
  if (market === 'Over/Under') return t.includes('under') ? 'under' : 'over';
  return 'odds';
}

function collectOdds(market, tip) {
  const data = {};
  document.querySelectorAll('#odds-fields .odds-input').forEach(i => {
    const v = parseFloat(i.value); if (!isNaN(v)) data[i.dataset.key] = v;
  });
  const key     = tipToOddsKey(tip, market);
  const primary = data[key] != null ? data[key] : (Object.values(data)[0] != null ? Object.values(data)[0] : null);
  return { odds_data: data, odds: primary };
}

// ── New Prediction form: league dropdown + fixture-driven team fields ──────
let formFixtures = [];

async function loadFormLeagues() {
  const sel = document.getElementById('m-league');
  try {
    const json = await Admin.api('GET', '/api/admin/form/leagues');
    if (!json.success) return;
    sel.innerHTML = '<option value="">Select a league…</option>' +
      json.data.map(l => `<option value="${l.id}" data-api-id="${l.api_league_id||''}">${l.name}${l.country?' · '+l.country:''}</option>`).join('');
  } catch (e) {}
}

function ensureLeagueOption(id, label) {
  const sel = document.getElementById('m-league');
  if (id && ![...sel.options].some(o => o.value == id)) {
    const o = document.createElement('option');
    o.value = id; o.textContent = label || ('League #' + id);
    sel.appendChild(o);
  }
}

// Set a <select>'s value, adding the option first if it isn't present
function setSelectValue(sel, value) {
  if (value == null || value === '') { sel.value = ''; return; }
  if (![...sel.options].some(o => o.value === String(value))) {
    const o = document.createElement('option');
    o.value = value; o.textContent = value;
    sel.appendChild(o);
  }
  sel.value = value;
}

// Load the league's fixtures and (re)populate the home/away team dropdowns
async function loadLeagueFixtures(keepHome, keepAway) {
  const leagueId = document.getElementById('m-league').value;
  const homeSel  = document.getElementById('m-home');
  const awaySel  = document.getElementById('m-away');
  const prevHome = keepHome != null ? keepHome : homeSel.value;
  const prevAway = keepAway != null ? keepAway : awaySel.value;
  formFixtures = [];
  homeSel.innerHTML = '<option value="">Select home team…</option>';
  awaySel.innerHTML = '<option value="">Select away team…</option>';
  if (!leagueId) { homeSel.options[0].textContent = 'Select a league first…'; return; }
  try {
    const json = await Admin.api('GET', '/api/admin/form/fixtures?league_id=' + encodeURIComponent(leagueId));
    if (json.success) {
      formFixtures = json.data;
      const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const homes = [...new Set(formFixtures.map(f => f.home_team))].sort();
      const aways = [...new Set(formFixtures.map(f => f.away_team))].sort();
      homeSel.innerHTML = '<option value="">Select home team…</option>' + homes.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
      awaySel.innerHTML = '<option value="">Select away team…</option>' + aways.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
    }
  } catch (e) {}
  if (prevHome) setSelectValue(homeSel, prevHome);
  if (prevAway) setSelectValue(awaySel, prevAway);
}

// When a home team is chosen, auto-select its opponent + kickoff from the fixture
function autofillAwayFromHome() {
  const home = document.getElementById('m-home').value.trim();
  if (!home || !formFixtures.length) return;
  const dateVal   = document.getElementById('m-date').value;
  const dateParam = dateVal ? dateVal.slice(0, 10) : '';
  const fx = formFixtures.find(f => f.home_team === home && (!dateParam || String(f.match_date).slice(0, 10) === dateParam))
          || formFixtures.find(f => f.home_team === home);
  if (fx) {
    setSelectValue(document.getElementById('m-away'), fx.away_team);
    if (fx.match_date) document.getElementById('m-date').value = String(fx.match_date).replace(' ', 'T').slice(0, 16);
  }
}

async function editPred(id) {
  const json = await Admin.api('GET', '/api/admin/predictions?page=1&limit=200');
  const p = json.data.predictions.find(x=>x.id===id);
  if (!p) return;
  editingId=id;
  document.getElementById('modal-title').textContent='Edit Prediction';
  ensureLeagueOption(p.league_id, (p.league_name||'League')+' #'+p.league_id);
  document.getElementById('m-league').value  = p.league_id||'';
  document.getElementById('m-date').value    = p.match_date?p.match_date.replace(' ','T').slice(0,16):'';
  document.getElementById('m-tip').value     = p.tip||'';
  document.getElementById('m-market').value  = p.market||'1X2';
  document.getElementById('m-odds').value    = p.odds||'';
  document.getElementById('m-conf').value    = p.confidence_score||'';
  document.getElementById('m-vis').value     = p.visibility||'free';
  document.getElementById('m-result').value  = p.result||'pending';
  document.getElementById('m-analysis').value= p.analysis||'';
  document.getElementById('m-hform').value   = p.home_form||'';
  document.getElementById('m-aform').value   = p.away_form||'';
  document.getElementById('m-published').checked = !!p.published_at;
  // Prefill odds: prefer stored odds_data, else seed the tip's field with the legacy single odds
  let oddsData = p.odds_data;
  if ((!oddsData || (typeof oddsData === 'object' && !Object.keys(oddsData).length)) && p.odds != null) {
    oddsData = { [tipToOddsKey(p.tip, p.market || '1X2')]: p.odds };
  }
  renderOddsFields(p.market || '1X2', oddsData);
  Admin.showModal('pred-modal');
  // Populate team dropdowns for this league, then select the saved teams
  await loadLeagueFixtures(p.home_team, p.away_team);
}

async function deletePred(id) {
  Admin.confirm('Delete this prediction? This cannot be undone.', async () => {
    const json = await Admin.api('DELETE', '/api/admin/predictions/'+id);
    if (json.success) { Admin.toast('Prediction deleted'); loadPredictions(predPage); }
    else Admin.toast(json.message||'Delete failed','error');
  });
}

let researchSuggestion = null;
let researchData = null;

async function researchPred(fixtureId, matchName) {
  researchSuggestion = null;
  researchData = null;
  document.getElementById('research-title').textContent = 'Research: ' + matchName;
  document.getElementById('research-loading').style.display = 'block';
  document.getElementById('research-content').style.display = 'none';
  document.getElementById('research-footer').style.display = 'none';
  Admin.showModal('research-modal');

  const json = await Admin.api('GET', '/api/sync/research/' + fixtureId);

  document.getElementById('research-loading').style.display = 'none';

  if (!json.success) {
    document.getElementById('research-content').style.display = 'block';
    document.getElementById('research-content').innerHTML = `<p style="color:var(--red);text-align:center;padding:20px;">${json.message || 'Failed to fetch research data'}</p>`;
    return;
  }

  const d = json.data;
  researchSuggestion = d.suggestion;
  researchData = d;

  function formBadges(formStr) {
    if (!formStr) return '<span style="color:var(--muted);">No data</span>';
    return formStr.split('').map(c => {
      const colors = { W:'#16a34a', D:'#d97706', L:'#e94560' };
      return `<span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:4px;background:${colors[c]||'#6b7280'};color:#fff;font-size:0.72rem;font-weight:700;margin-right:3px;">${c}</span>`;
    }).join('');
  }

  function recentTable(rows) {
    if (!rows || !rows.length) return '<p style="color:var(--muted);font-size:0.82rem;">No recent matches</p>';
    return `<table style="width:100%;border-collapse:collapse;font-size:0.78rem;">
      <thead><tr style="border-bottom:1px solid var(--border);">
        <th style="text-align:left;padding:4px 6px;color:var(--muted);">Date</th>
        <th style="text-align:left;padding:4px 6px;color:var(--muted);">Match</th>
        <th style="text-align:center;padding:4px 6px;color:var(--muted);">Score</th>
        <th style="text-align:center;padding:4px 6px;color:var(--muted);">Result</th>
      </tr></thead>
      <tbody>${rows.map(r => {
        const rc = {W:'var(--green)',D:'var(--yellow)',L:'var(--red)'}[r.result]||'var(--muted)';
        return `<tr style="border-bottom:1px solid var(--border);">
          <td style="padding:5px 6px;color:var(--muted);">${r.date||'—'}</td>
          <td style="padding:5px 6px;">${r.home} vs ${r.away}</td>
          <td style="padding:5px 6px;text-align:center;font-weight:700;">${r.score}</td>
          <td style="padding:5px 6px;text-align:center;color:${rc};font-weight:700;">${r.result}</td>
        </tr>`;
      }).join('')}</tbody></table>`;
  }

  const hs = d.home_stats, as_ = d.away_stats;
  const hst = d.home_standing, ast = d.away_standing;

  document.getElementById('research-content').innerHTML = `
    <!-- Suggestion banner -->
    <div style="background:rgba(233,69,96,0.08);border:1px solid rgba(233,69,96,0.25);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div>
        <div style="font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">Algorithm Suggestion</div>
        <div style="font-family:var(--font-head);font-size:1.4rem;font-weight:800;color:var(--red);">${d.suggestion.tip}</div>
        <div style="font-size:0.78rem;color:var(--muted);margin-top:2px;">${d.suggestion.market} — ${d.suggestion.reason}</div>
      </div>
      <div style="text-align:right;">
        ${d.h2h_summary ? `<div style="font-size:0.78rem;color:var(--muted);">H2H: <strong style="color:var(--text);">${d.h2h_summary}</strong></div>` : ''}
        <div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">Home form: <strong>${d.home_form||'—'}</strong> &nbsp;|&nbsp; Away form: <strong>${d.away_form||'—'}</strong></div>
      </div>
    </div>

    <!-- Form + Standings side by side -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
      <div style="background:var(--surface);border-radius:8px;padding:14px;border:1px solid var(--border);">
        <div style="font-weight:700;font-size:0.85rem;margin-bottom:8px;">${d.fixture.home.name}</div>
        <div style="margin-bottom:8px;">${formBadges(d.home_form)}</div>
        ${hst ? `<div style="font-size:0.78rem;color:var(--muted);">Rank <strong style="color:var(--text);">#${hst.rank}</strong> · ${hst.points} pts · ${hst.played} played · GD ${hst.gd>0?'+':''}${hst.gd}</div>` : ''}
        ${hs ? `<div style="font-size:0.75rem;color:var(--muted);margin-top:6px;">Goals for: <strong>${hs.goals_for_avg}</strong>/game · Against: <strong>${hs.goals_against_avg}</strong>/game</div>` : ''}
      </div>
      <div style="background:var(--surface);border-radius:8px;padding:14px;border:1px solid var(--border);">
        <div style="font-weight:700;font-size:0.85rem;margin-bottom:8px;">${d.fixture.away.name}</div>
        <div style="margin-bottom:8px;">${formBadges(d.away_form)}</div>
        ${ast ? `<div style="font-size:0.78rem;color:var(--muted);">Rank <strong style="color:var(--text);">#${ast.rank}</strong> · ${ast.points} pts · ${ast.played} played · GD ${ast.gd>0?'+':''}${ast.gd}</div>` : ''}
        ${as_ ? `<div style="font-size:0.75rem;color:var(--muted);margin-top:6px;">Goals for: <strong>${as_.goals_for_avg}</strong>/game · Against: <strong>${as_.goals_against_avg}</strong>/game</div>` : ''}
      </div>
    </div>

    <!-- Recent form detail -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
      <div>
        <div style="font-weight:700;font-size:0.82rem;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">${d.fixture.home.name} — Last 5</div>
        ${recentTable(d.home_recent)}
      </div>
      <div>
        <div style="font-weight:700;font-size:0.82rem;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">${d.fixture.away.name} — Last 5</div>
        ${recentTable(d.away_recent)}
      </div>
    </div>

    <!-- H2H -->
    ${d.h2h_recent && d.h2h_recent.length ? `
    <div>
      <div style="font-weight:700;font-size:0.82rem;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Head to Head — Last 5 Meetings</div>
      ${recentTable(d.h2h_recent)}
    </div>` : ''}
  `;

  document.getElementById('research-content').style.display = 'block';
  document.getElementById('research-footer').style.display = 'flex';
}

document.addEventListener('DOMContentLoaded', async () => {
  Admin.buildSidebar();
  const user = await Admin.requireAdmin();
  if (!user) return;
  loadPredictions(1);
  document.getElementById('new-pred-btn').addEventListener('click', openNewModal);

  document.getElementById('apply-suggestion-btn').addEventListener('click', async () => {
    if (!researchSuggestion || !researchData) return;
    const d = researchData;
    Admin.hideModal('research-modal');
    // Build a fresh "edit form" pre-filled from the researched fixture
    editingId = null;
    document.getElementById('modal-title').textContent = 'New Prediction';
    document.getElementById('m-date').value   = d.fixture.date ? d.fixture.date.replace(' ', 'T').slice(0, 16) : '';
    document.getElementById('m-tip').value    = researchSuggestion.tip;
    document.getElementById('m-market').value = researchSuggestion.market;
    document.getElementById('m-hform').value  = d.home_form || '';
    document.getElementById('m-aform').value  = d.away_form || '';
    document.getElementById('m-conf').value   = '';   // admin clicks Auto-Score
    document.getElementById('m-vis').value    = 'free';
    document.getElementById('m-result').value = 'pending';
    document.getElementById('m-published').checked = false;
    renderOddsFields(researchSuggestion.market);
    // Match the league dropdown to the researched fixture (by API league id)
    const leagueSel = document.getElementById('m-league');
    if (leagueSel && d.fixture.league) {
      const opt = [...leagueSel.options].find(o => o.dataset && o.dataset.apiId == d.fixture.league.id);
      if (opt) leagueSel.value = opt.value;
    }
    Admin.showModal('pred-modal');
    Admin.toast('Suggestion applied — review and save');
    // Load the league's teams then select home/away from the fixture
    await loadLeagueFixtures(d.fixture.home.name || '', d.fixture.away.name || '');
  });
  document.getElementById('apply-filters').addEventListener('click', () => loadPredictions(1));
  // Auto-apply when any filter changes (e.g. picking a date shows that date immediately)
  ['f-result', 'f-visibility', 'f-date'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => { predPage = 1; loadPredictions(1); });
  });
  document.getElementById('p-prev').addEventListener('click', () => loadPredictions(--predPage));
  document.getElementById('p-next').addEventListener('click', () => loadPredictions(++predPage));

  // New Prediction form: league dropdown + fixture-driven team fields + odds
  loadFormLeagues();
  renderOddsFields('1X2');
  document.getElementById('m-league').addEventListener('change', () => loadLeagueFixtures());
  document.getElementById('m-date').addEventListener('change', autofillAwayFromHome);
  document.getElementById('m-home').addEventListener('change', autofillAwayFromHome);
  document.getElementById('m-market').addEventListener('change', e => renderOddsFields(e.target.value));

  // Auto-Score single prediction (only works when editing an existing one)
  document.getElementById('auto-score-btn').addEventListener('click', async () => {
    if (!editingId) {
      // For new predictions, score from the form fields directly
      const _m = document.getElementById('m-market').value;
      const _t = document.getElementById('m-tip').value.trim();
      const pseudo = {
        tip:          _t,
        market:       _m,
        odds:         collectOdds(_m, _t).odds,
        home_form:    document.getElementById('m-hform').value.trim(),
        away_form:    document.getElementById('m-aform').value.trim(),
        h2h_summary:  '',
        league_id:    parseInt(document.getElementById('m-league').value) || 39,
      };
      const res  = await fetch('/api/admin/predictions/preview-score', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(pseudo),
      });
      const json = await res.json();
      if (json.success) {
        document.getElementById('m-conf').value = json.data.score;
        Admin.toast(`Score: ${json.data.score} — ${describeScore(json.data.score)}`);
      } else {
        Admin.toast(json.message || 'Score failed', 'error');
      }
      return;
    }
    const btn = document.getElementById('auto-score-btn');
    btn.disabled = true;
    const json = await Admin.api('POST', `/api/admin/predictions/${editingId}/score`);
    btn.disabled = false;
    if (json.success) {
      document.getElementById('m-conf').value = json.data.score;
      Admin.toast(`Score: ${json.data.score} — ${describeScore(json.data.score)}`);
    } else {
      Admin.toast(json.message || 'Scoring failed', 'error');
    }
  });

  // Score All pending predictions
  document.getElementById('score-all-btn').addEventListener('click', async () => {
    const btn = document.getElementById('score-all-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="material-icons-round" style="animation:spin 1s linear infinite;font-size:0.9rem;">refresh</span>Scoring...';
    const json = await Admin.api('POST', '/api/admin/predictions/score-all');
    btn.disabled = false;
    btn.innerHTML = '<span class="material-icons-round">auto_awesome</span>Score All';
    if (json.success) {
      Admin.toast(`${json.data.updated} predictions scored`);
      loadPredictions(predPage);
    } else {
      Admin.toast(json.message || 'Batch score failed', 'error');
    }
  });
  document.getElementById('save-pred-btn').addEventListener('click', async () => {
    const market = document.getElementById('m-market').value;
    const tip    = document.getElementById('m-tip').value.trim();
    const { odds_data, odds } = collectOdds(market, tip);
    const body = {
      league_id:        parseInt(document.getElementById('m-league').value),
      home_team:        document.getElementById('m-home').value.trim(),
      away_team:        document.getElementById('m-away').value.trim(),
      match_date:       document.getElementById('m-date').value,
      tip:              tip,
      market:           market,
      odds:             odds,
      odds_data:        odds_data,
      confidence_score: parseInt(document.getElementById('m-conf').value)||null,
      visibility:       document.getElementById('m-vis').value,
      result:           document.getElementById('m-result').value,
      analysis:         document.getElementById('m-analysis').value.trim(),
      home_form:        document.getElementById('m-hform').value.trim(),
      away_form:        document.getElementById('m-aform').value.trim(),
      published:        document.getElementById('m-published').checked,
    };
    if (!body.home_team || !body.away_team || !body.tip || !body.match_date) {
      Admin.toast('Please fill in all required fields', 'error'); return;
    }
    const url    = editingId ? '/api/admin/predictions/'+editingId : '/api/admin/predictions';
    const method = editingId ? 'PUT' : 'POST';
    const json   = await Admin.api(method, url, body);
    if (json.success) { Admin.toast(editingId?'Updated':'Created'); Admin.hideModal('pred-modal'); loadPredictions(predPage); }
    else Admin.toast(json.message||'Save failed','error');
  });
});
</script>
</body></html>
