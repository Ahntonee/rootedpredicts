<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Posts | Rooted Predictions Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">
  <style>
    /* Quill dark-theme overrides */
    .ql-toolbar.ql-snow {
      background: var(--surface-2);
      border-color: var(--border) !important;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .ql-container.ql-snow {
      background: var(--surface);
      border-color: var(--border) !important;
      border-radius: 0 0 var(--radius) var(--radius);
      font-family: var(--font-body);
      font-size: 0.93rem;
      min-height: 240px;
      color: var(--text);
    }
    .ql-editor { min-height: 240px; color: var(--text); }
    .ql-editor.ql-blank::before { color: var(--muted); font-style: normal; }
    .ql-toolbar .ql-stroke { stroke: var(--text-soft) !important; }
    .ql-toolbar .ql-fill  { fill:   var(--text-soft) !important; }
    .ql-toolbar .ql-picker-label { color: var(--text-soft) !important; }
    .ql-toolbar button:hover .ql-stroke,
    .ql-toolbar button.ql-active .ql-stroke { stroke: var(--text) !important; }
    .ql-toolbar button:hover .ql-fill,
    .ql-toolbar button.ql-active .ql-fill   { fill:   var(--text) !important; }
    .ql-toolbar .ql-picker-options {
      background: var(--surface-2);
      border-color: var(--border) !important;
      color: var(--text);
    }
    .ql-snow .ql-tooltip {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }
    .ql-snow .ql-tooltip input[type=text] {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }
  </style>
</head>
<body>
<div id="admin-sidebar" class="admin-sidebar"></div>
<div class="admin-topbar"><span class="admin-topbar-title">Blog Post CMS</span><button class="btn btn-primary btn-sm" onclick="openNew()"><span class="material-icons-round">add</span>New Post</button></div>
<main class="admin-main">
  <div class="card" style="overflow:hidden;">
    <div id="blog-loading" style="text-align:center;padding:40px;"><p style="color:var(--muted);">Loading posts...</p></div>
    <table class="leaderboard-table" id="blog-table" style="display:none;">
      <thead><tr><th>Title</th><th>Category</th><th>Author</th><th>Status</th><th>Published</th><th>Actions</th></tr></thead>
      <tbody id="blog-tbody"></tbody>
    </table>
  </div>
</main>

<!-- Blog Modal -->
<div id="blog-modal" class="admin-modal-overlay" style="display:none;">
  <div class="admin-modal" style="max-width:720px;">
    <div class="admin-modal-header"><span class="admin-modal-title" id="blog-modal-title">New Blog Post</span><button class="admin-close-btn" onclick="Admin.hideModal('blog-modal')"><span class="material-icons-round">close</span></button></div>
    <div class="admin-modal-body">
      <input type="hidden" id="blog-id">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="form-group" style="margin:0;"><label class="form-label">Title *</label><input type="text" class="form-control" id="b-title" placeholder="Article title"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group" style="margin:0;"><label class="form-label">Category</label>
            <select class="form-control" id="b-cat">
              <option value="">Select category&hellip;</option>
              <option>Match Preview</option>
              <option>Betting Guide</option>
              <option>League Analysis</option>
              <option>Tips Strategy</option>
              <option>Sport Talk</option>
            </select>
          </div>
          <div class="form-group" style="margin:0;"><label class="form-label">Meta Title</label><input type="text" class="form-control" id="b-meta-title" placeholder="SEO title"></div>
        </div>

        <div class="form-group" style="margin:0;">
          <label class="form-label">Featured Image</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="text" class="form-control" id="b-image" placeholder="Paste an image URL, or upload from your device &rarr;" style="flex:1;">
            <label class="btn btn-outline btn-sm" style="margin:0;cursor:pointer;white-space:nowrap;"><span class="material-icons-round">upload</span>Upload<input type="file" id="b-image-file" accept="image/*" style="display:none;"></label>
          </div>
          <img id="b-image-preview" alt="" style="display:none;max-height:130px;margin-top:8px;border-radius:8px;border:1px solid var(--border);">
          <input type="text" class="form-control" id="b-image-alt" placeholder="Image alt text (for SEO &amp; accessibility)" style="margin-top:6px;">
        </div>

        <div class="form-group" style="margin:0;"><label class="form-label">Excerpt</label><textarea class="form-control" id="b-excerpt" rows="2" placeholder="Short summary for blog listing page..."></textarea></div>

        <div class="form-group" style="margin:0;">
          <label class="form-label" style="display:flex;align-items:center;justify-content:space-between;">
            Content *
            <label class="btn btn-outline btn-sm" style="margin:0;padding:3px 9px;font-size:0.72rem;cursor:pointer;"><span class="material-icons-round" style="font-size:0.85rem;">image</span>Insert Image<input type="file" id="b-content-image" accept="image/*" style="display:none;"></label>
          </label>
          <div id="b-content-editor"></div>
        </div>

        <div class="form-group" style="margin:0;"><label class="form-label">Meta Description</label><textarea class="form-control" id="b-meta-desc" rows="2" placeholder="SEO meta description (max 160 chars)..."></textarea></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Keywords</label><input type="text" class="form-control" id="b-keywords" placeholder="comma, separated, keywords"></div>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="b-published"><span class="form-label" style="margin:0;">Publish immediately</span></label>
      </div>
    </div>
    <div class="admin-modal-footer">
      <button class="btn btn-outline btn-sm" onclick="Admin.hideModal('blog-modal')">Cancel</button>
      <button class="btn btn-primary btn-sm" id="save-blog-btn"><span class="material-icons-round">save</span>Save Post</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>
const theme = localStorage.getItem('afro_theme') || 'dark';
document.documentElement.setAttribute('data-theme', theme);
let blogEditId = null;
let quill;

function fileToResizedDataURL(file, maxW = 1000, quality = 0.8) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return reject(new Error('Not an image'));
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showImagePreview(src) {
  const el = document.getElementById('b-image-preview');
  if (src) { el.src = src; el.style.display = 'block'; } else { el.style.display = 'none'; el.removeAttribute('src'); }
}

function getContent()  { return quill.root.innerHTML === '<p><br></p>' ? '' : quill.root.innerHTML; }
function setContent(v) { quill.clipboard.dangerouslyPasteHTML(v || ''); }
function clearContent(){ quill.setContents([]); }

async function loadPosts() {
  const json = await Admin.api('GET', '/api/admin/blog');
  document.getElementById('blog-loading').style.display = 'none';
  if (!json.success) return;
  document.getElementById('blog-table').style.display = 'table';
  document.getElementById('blog-tbody').innerHTML = json.data.map(p => `
    <tr>
      <td style="font-weight:600;font-size:0.875rem;">${p.title}</td>
      <td style="font-size:0.82rem;color:var(--muted);">${p.category||'&mdash;'}</td>
      <td style="font-size:0.82rem;">${p.author_name||'&mdash;'}</td>
      <td>${p.is_published?'<span class="badge badge-won">Published</span>':'<span class="badge badge-pending">Draft</span>'}</td>
      <td style="font-size:0.78rem;color:var(--muted);">${Admin.fmtDate(p.published_at)}</td>
      <td><div style="display:flex;gap:4px;">
        <button onclick="editPost(${p.id})" class="btn btn-outline btn-sm" style="padding:4px 8px;"><span class="material-icons-round" style="font-size:0.9rem;">edit</span></button>
        <button onclick="deletePost(${p.id})" class="btn btn-sm" style="padding:4px 8px;background:rgba(233,69,96,0.1);color:var(--red);border:1px solid rgba(233,69,96,0.2);"><span class="material-icons-round" style="font-size:0.9rem;">delete</span></button>
      </div></td>
    </tr>`).join('');
}

function openNew() {
  blogEditId = null;
  document.getElementById('blog-modal-title').textContent = 'New Blog Post';
  ['b-title','b-excerpt','b-meta-title','b-meta-desc','b-keywords','b-image','b-image-alt'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('b-cat').value = '';
  document.getElementById('b-published').checked = false;
  showImagePreview('');
  // Show modal first so the editor div is visible before Quill initialises
  Admin.showModal('blog-modal');
  ensureQuill();
  clearContent();
}

async function editPost(id) {
  const json = await Admin.api('GET', '/api/admin/blog/'+id);
  const p = json.data;
  if (!p) return;
  blogEditId = id;
  document.getElementById('blog-modal-title').textContent = 'Edit Post';
  document.getElementById('b-title').value       = p.title || '';
  document.getElementById('b-cat').value          = p.category || '';
  document.getElementById('b-excerpt').value      = p.excerpt || '';
  document.getElementById('b-meta-title').value   = p.meta_title || '';
  document.getElementById('b-meta-desc').value    = p.meta_description || '';
  document.getElementById('b-keywords').value     = p.keywords || '';
  document.getElementById('b-image').value        = p.featured_image || '';
  document.getElementById('b-image-alt').value    = p.featured_image_alt || '';
  showImagePreview(p.featured_image || '');
  document.getElementById('b-published').checked  = !!p.is_published;
  // Show modal first so editor div is visible before Quill initialises
  Admin.showModal('blog-modal');
  ensureQuill();
  setContent(p.content || '');
}

async function deletePost(id) {
  Admin.confirm('Delete this blog post?', async () => {
    const json = await Admin.api('DELETE', '/api/admin/blog/' + id);
    if (json.success) { Admin.toast('Post deleted'); loadPosts(); }
    else Admin.toast(json.message || 'Failed', 'error');
  });
}

async function savePost() {
  const btn = document.getElementById('save-blog-btn');
  const body = {
    title:              document.getElementById('b-title').value.trim(),
    content:            getContent(),
    excerpt:            document.getElementById('b-excerpt').value.trim(),
    category:           document.getElementById('b-cat').value.trim(),
    featured_image:     document.getElementById('b-image').value.trim(),
    featured_image_alt: document.getElementById('b-image-alt').value.trim(),
    meta_title:         document.getElementById('b-meta-title').value.trim(),
    meta_description:   document.getElementById('b-meta-desc').value.trim(),
    keywords:           document.getElementById('b-keywords').value.trim(),
    published:          document.getElementById('b-published').checked,
  };
  if (!body.title || !body.content) { Admin.toast('Title and content are required', 'error'); return; }
  btn.disabled = true;
  try {
    const url    = blogEditId ? '/api/admin/blog/' + blogEditId : '/api/admin/blog';
    const method = blogEditId ? 'PUT' : 'POST';
    const json   = await Admin.api(method, url, body);
    if (json.success) { Admin.toast(blogEditId ? 'Post updated' : 'Post created'); Admin.hideModal('blog-modal'); loadPosts(); }
    else Admin.toast(json.message || 'Save failed', 'error');
  } catch (e) {
    Admin.toast(e.message || 'Save failed', 'error');
  } finally {
    btn.disabled = false;
  }
}

function ensureQuill() {
  if (quill) return;
  quill = new Quill('#b-content-editor', {
    theme: 'snow',
    placeholder: 'Write article content here...',
    modules: {
      toolbar: [
        [{ header: [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        ['blockquote', 'code-block'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['link', 'image'],
        ['clean'],
      ],
    },
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  const u = await Admin.requireAdmin();
  if (!u) return;
  Admin.buildSidebar(u);
  loadPosts();

  document.getElementById('save-blog-btn').addEventListener('click', savePost);

  document.getElementById('b-image').addEventListener('input', e => showImagePreview(e.target.value.trim()));

  document.getElementById('b-image-file').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const data = await fileToResizedDataURL(file, 1000, 0.8);
      document.getElementById('b-image').value = data;
      showImagePreview(data);
      Admin.toast('Image added');
    } catch (err) { Admin.toast('Could not read that image', 'error'); }
    e.target.value = '';
  });

  document.getElementById('b-content-image').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const data = await fileToResizedDataURL(file, 1000, 0.8);
      const range = quill.getSelection(true);
      quill.insertEmbed(range ? range.index : quill.getLength(), 'image', data);
      Admin.toast('Image inserted into content');
    } catch (err) { Admin.toast('Could not read that image', 'error'); }
    e.target.value = '';
  });
});
</script>
</body></html>
