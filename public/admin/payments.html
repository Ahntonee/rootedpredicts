<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Approvals | Rooted Predictions Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="admin-sidebar" class="admin-sidebar"></div>
<div class="admin-topbar"><span class="admin-topbar-title">Payment Approvals</span></div>
<main class="admin-main">

  <!-- Status filter tabs -->
  <div style="display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px;">
    <button class="btn btn-sm status-tab active" data-status="pending" id="tab-pending">
      <span class="material-icons-round">hourglass_top</span>Pending
      <span id="tab-pending-count" style="background:var(--red);color:#fff;border-radius:50px;padding:1px 7px;font-size:0.72rem;font-weight:700;margin-left:4px;"></span>
    </button>
    <button class="btn btn-sm btn-outline status-tab" data-status="approved" id="tab-approved">
      <span class="material-icons-round">check_circle</span>Approved
    </button>
    <button class="btn btn-sm btn-outline status-tab" data-status="rejected" id="tab-rejected">
      <span class="material-icons-round">cancel</span>Rejected
    </button>
  </div>

  <!-- Table -->
  <div class="card" style="overflow:hidden;">
    <div id="ps-loading" style="text-align:center;padding:48px;">
      <p style="color:var(--muted);">Loading submissions...</p>
    </div>
    <div id="ps-empty" style="display:none;text-align:center;padding:48px;">
      <span class="material-icons-round" style="font-size:3rem;color:var(--muted);display:block;margin-bottom:12px;">inbox</span>
      <p style="color:var(--muted);">No submissions here.</p>
    </div>
    <div id="ps-table" style="display:none;overflow-x:auto;">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>User</th>
            <th>Plan</th>
            <th>Amount</th>
            <th>Submitted</th>
            <th>Receipt</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ps-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
  <div id="ps-pagination" style="display:none;justify-content:center;gap:8px;margin-top:16px;align-items:center;">
    <button id="ps-prev" class="btn btn-outline btn-sm" disabled><span class="material-icons-round">chevron_left</span></button>
    <span id="ps-info" style="font-size:0.85rem;color:var(--muted);"></span>
    <button id="ps-next" class="btn btn-outline btn-sm"><span class="material-icons-round">chevron_right</span></button>
  </div>
</main>

<!-- Receipt Image Modal -->
<div id="receipt-modal" class="admin-modal-overlay" style="display:none;">
  <div class="admin-modal" style="max-width:600px;">
    <div class="admin-modal-header">
      <span class="admin-modal-title">Payment Receipt</span>
      <button class="admin-close-btn" onclick="Admin.hideModal('receipt-modal')"><span class="material-icons-round">close</span></button>
    </div>
    <div class="admin-modal-body" style="text-align:center;">
      <img id="receipt-img" src="" alt="Payment receipt" style="max-width:100%;max-height:500px;border-radius:8px;object-fit:contain;">
      <p id="receipt-loading" style="color:var(--muted);padding:40px;">Loading image...</p>
    </div>
  </div>
</div>

<!-- Reject Modal -->
<div id="reject-modal" class="admin-modal-overlay" style="display:none;">
  <div class="admin-modal" style="max-width:400px;">
    <div class="admin-modal-header">
      <span class="admin-modal-title">Reject Submission</span>
      <button class="admin-close-btn" onclick="Admin.hideModal('reject-modal')"><span class="material-icons-round">close</span></button>
    </div>
    <div class="admin-modal-body">
      <p style="font-size:0.875rem;color:var(--text-soft);margin-bottom:14px;">Optionally provide a reason — it will be included in the email to the user.</p>
      <input type="hidden" id="reject-id">
      <div class="form-group">
        <label class="form-label">Reason (optional)</label>
        <textarea id="reject-notes" class="form-control" rows="3" placeholder="e.g. Screenshot is unclear, amount does not match..."></textarea>
      </div>
    </div>
    <div class="admin-modal-footer">
      <button class="btn btn-outline btn-sm" onclick="Admin.hideModal('reject-modal')">Cancel</button>
      <button class="btn btn-sm" style="background:var(--red);color:#fff;" id="reject-confirm-btn">Reject &amp; Notify User</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
<script>
var theme = localStorage.getItem('afro_theme') || 'dark';
document.documentElement.setAttribute('data-theme', theme);

var currentStatus = 'pending';
var currentPage   = 1;

var planLabels  = { monthly: 'Monthly', quarterly: 'Quarterly', annual: 'Annual' };
var planAmounts = { monthly: '8,000', quarterly: '20,800', annual: '64,000' };

function fmtDate(d) {
  if (!d) return '-';
  return new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function loadSubmissions(status, page) {
  status = status || currentStatus;
  page   = page   || 1;
  currentStatus = status;
  currentPage   = page;

  document.getElementById('ps-loading').style.display = 'block';
  document.getElementById('ps-table').style.display   = 'none';
  document.getElementById('ps-empty').style.display   = 'none';
  document.getElementById('ps-pagination').style.display = 'none';

  try {
    var json = await Admin.api('GET', '/api/admin/payment-submissions?status=' + status + '&page=' + page);
    document.getElementById('ps-loading').style.display = 'none';

    if (!json.success) {
      document.getElementById('ps-empty').style.display = 'block';
      return;
    }

    var rows = json.data || [];

    // Update pending count badge
    if (status === 'pending') {
      var badge = document.getElementById('tab-pending-count');
      badge.textContent = json.total || '';
      badge.style.display = json.total ? '' : 'none';
    }

    if (!rows.length) {
      document.getElementById('ps-empty').style.display = 'block';
      return;
    }

    var tbody = document.getElementById('ps-tbody');
    tbody.innerHTML = rows.map(function(r, i) {
      var statusBadge = r.status === 'approved'
        ? '<span class="badge badge-won">APPROVED</span>'
        : r.status === 'rejected'
          ? '<span class="badge badge-lost">REJECTED</span>'
          : '<span class="badge badge-pending">PENDING</span>';

      var actions = '';
      if (r.status === 'pending') {
        actions =
          '<button class="btn btn-sm" style="background:var(--green);color:#fff;margin-right:6px;" onclick="approveSubmission(' + r.id + ')">Approve</button>' +
          '<button class="btn btn-sm btn-outline" style="color:var(--red);border-color:var(--red);" onclick="openRejectModal(' + r.id + ')">Reject</button>';
      } else {
        actions = statusBadge + (r.notes ? '<br><small style="color:var(--muted);">' + r.notes + '</small>' : '');
      }

      return '<tr>' +
        '<td>' + ((page - 1) * 20 + i + 1) + '</td>' +
        '<td><div style="font-weight:600;">' + (r.user_name || '') + '</div><div style="font-size:0.78rem;color:var(--muted);">' + r.user_email + '</div></td>' +
        '<td>' + (planLabels[r.plan] || r.plan) + '</td>' +
        '<td style="font-weight:700;">&#8358;' + (planAmounts[r.plan] || '') + '</td>' +
        '<td style="font-size:0.82rem;color:var(--muted);">' + fmtDate(r.submitted_at) + '</td>' +
        '<td><button class="btn btn-outline btn-sm" onclick="viewReceipt(' + r.id + ')"><span class="material-icons-round">visibility</span>View</button></td>' +
        '<td>' + (r.status === 'pending' ? actions : statusBadge + (r.notes ? '<div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">' + r.notes + '</div>' : '')) + '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('ps-table').style.display = 'block';

    // Pagination
    var totalPages = Math.ceil(json.total / (json.limit || 20));
    if (totalPages > 1) {
      document.getElementById('ps-pagination').style.display = 'flex';
      document.getElementById('ps-info').textContent = 'Page ' + page + ' of ' + totalPages + ' (' + json.total + ' total)';
      document.getElementById('ps-prev').disabled = page <= 1;
      document.getElementById('ps-next').disabled = page >= totalPages;
    }
  } catch (e) {
    document.getElementById('ps-loading').style.display = 'none';
    document.getElementById('ps-empty').style.display   = 'block';
  }
}

function viewReceipt(id) {
  var img = document.getElementById('receipt-img');
  var loading = document.getElementById('receipt-loading');
  img.style.display     = 'none';
  loading.style.display = 'block';
  Admin.showModal('receipt-modal');

  img.onload = function() {
    loading.style.display = 'none';
    img.style.display     = 'block';
  };
  img.onerror = function() {
    loading.textContent   = 'Could not load image.';
    loading.style.display = 'block';
  };
  img.src = '/api/admin/payment-submissions/' + id + '/image?' + Date.now();
}

async function approveSubmission(id) {
  Admin.confirm('Approve this payment and activate VIP for this user?', async function() {
    var json = await Admin.api('POST', '/api/admin/payment-submissions/' + id + '/approve');
    if (json.success) {
      Admin.toast('VIP activated and user notified.');
      loadSubmissions(currentStatus, currentPage);
    } else {
      Admin.toast(json.message || 'Approval failed.', 'error');
    }
  });
}

function openRejectModal(id) {
  document.getElementById('reject-id').value         = id;
  document.getElementById('reject-notes').value      = '';
  Admin.showModal('reject-modal');
}

document.getElementById('reject-confirm-btn').addEventListener('click', async function() {
  var id    = document.getElementById('reject-id').value;
  var notes = document.getElementById('reject-notes').value.trim();
  var json  = await Admin.api('POST', '/api/admin/payment-submissions/' + id + '/reject', { notes: notes });
  Admin.hideModal('reject-modal');
  if (json.success) {
    Admin.toast('Submission rejected and user notified.');
    loadSubmissions(currentStatus, currentPage);
  } else {
    Admin.toast(json.message || 'Rejection failed.', 'error');
  }
});

// Status tab switching
document.querySelectorAll('.status-tab').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.status-tab').forEach(function(b) {
      b.classList.remove('active');
      b.classList.add('btn-outline');
    });
    btn.classList.add('active');
    btn.classList.remove('btn-outline');
    loadSubmissions(btn.dataset.status, 1);
  });
});

document.getElementById('ps-prev').addEventListener('click', function() {
  if (currentPage > 1) loadSubmissions(currentStatus, currentPage - 1);
});
document.getElementById('ps-next').addEventListener('click', function() {
  loadSubmissions(currentStatus, currentPage + 1);
});

document.addEventListener('DOMContentLoaded', async function() {
  var user = await Admin.requireAdmin();
  if (!user) return;
  if (user.effectiveRole !== 'superadmin') {
    document.querySelector('.admin-main').innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);">Only superadmins can review payment submissions.</div>';
    Admin.buildSidebar(user);
    return;
  }
  Admin.buildSidebar(user);
  loadSubmissions('pending', 1);
});
</script>
</body></html>
