<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users | Rooted Predictions Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.min.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="admin-sidebar" class="admin-sidebar"></div>
<div class="admin-topbar"><span class="admin-topbar-title">Manage Users</span></div>
<main class="admin-main">
  <div class="admin-table-header">
    <div class="admin-filters">
      <select class="admin-filter-select" id="f-role"><option value="">All Roles</option><option value="user">User</option><option value="vip">VIP</option><option value="admin">Admin</option></select>
      <select class="admin-filter-select" id="f-country"><option value="">All Countries</option><option>Nigeria</option><option>Ghana</option><option>Kenya</option><option>South Africa</option><option>United Kingdom</option><option>United States</option></select>
      <div style="position:relative;"><span class="material-icons-round" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--muted);">search</span><input type="text" class="admin-search" id="f-search" placeholder="Search name or email..."></div>
    </div>
    <button class="btn btn-outline btn-sm" id="apply-filters"><span class="material-icons-round">filter_list</span>Apply</button>
  </div>
  <div class="card" style="overflow:hidden;">
    <div id="user-loading" style="text-align:center;padding:40px;"><p style="color:var(--muted);">Loading users...</p></div>
    <div id="user-table" style="display:none;overflow-x:auto;">
      <table class="leaderboard-table">
        <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th>Country</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="user-tbody"></tbody>
      </table>
    </div>
  </div>
  <div id="user-pagination" style="display:none;justify-content:center;gap:8px;margin-top:16px;align-items:center;">
    <button id="u-prev" class="btn btn-outline btn-sm" disabled><span class="material-icons-round">chevron_left</span></button>
    <span id="u-info" style="font-size:0.85rem;color:var(--muted);"></span>
    <button id="u-next" class="btn btn-outline btn-sm"><span class="material-icons-round">chevron_right</span></button>
  </div>
</main>

<!-- Edit User Modal -->
<div id="user-modal" class="admin-modal-overlay" style="display:none;">
  <div class="admin-modal" style="max-width:400px;">
    <div class="admin-modal-header"><span class="admin-modal-title">Edit User</span><button class="admin-close-btn" onclick="Admin.hideModal('user-modal')"><span class="material-icons-round">close</span></button></div>
    <div class="admin-modal-body">
      <input type="hidden" id="u-edit-id">
      <p id="u-edit-name" style="font-weight:600;margin-bottom:16px;"></p>
      <div class="form-group"><label class="form-label">Role</label>
        <select class="form-control" id="u-role"><option value="user">User (Free)</option><option value="vip">VIP</option><option value="admin">Admin</option></select>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;-webkit-user-select:text;user-select:text;">
          <input type="checkbox" id="u-banned"> <span class="form-label" style="margin:0;color:var(--red);">Ban this account</span>
        </label>
      </div>
    </div>
    <div class="admin-modal-footer">
      <button class="btn btn-outline btn-sm" onclick="Admin.hideModal('user-modal')">Cancel</button>
      <button class="btn btn-primary btn-sm" id="save-user-btn"><span class="material-icons-round">save</span>Save</button>
    </div>
  </div>
</div>

<script src="/js/app.min.js"></script>
<script src="/js/admin.js"></script>
<script>
const theme = localStorage.getItem('afro_theme')||'light';
document.documentElement.setAttribute('data-theme',theme);
let userPage=1;

async function loadUsers(page) {
  page=page||1;
  const role    = document.getElementById('f-role').value;
  const country = document.getElementById('f-country').value;
  const search  = document.getElementById('f-search').value;
  let url = `/api/admin/users?page=${page}&limit=20`;
  if (role)    url+='&role='+role;
  if (country) url+='&country='+encodeURIComponent(country);
  if (search)  url+='&search='+encodeURIComponent(search);
  document.getElementById('user-loading').style.display='block';
  document.getElementById('user-table').style.display='none';
  const json = await Admin.api('GET', url);
  document.getElementById('user-loading').style.display='none';
  if (!json.success) return;
  const d = json.data;
  document.getElementById('user-table').style.display='block';
  document.getElementById('user-tbody').innerHTML = d.users.map(u=>`
    <tr>
      <td style="font-size:0.8rem;color:var(--muted);">#${u.id}</td>
      <td><div style="font-weight:600;font-size:0.875rem;">${u.name}</div></td>
      <td style="font-size:0.82rem;color:var(--muted);">${u.email}</td>
      <td>${Admin.badge(u.role)}</td>
      <td style="font-size:0.82rem;">${u.country||'â€”'}</td>
      <td style="font-size:0.78rem;color:var(--muted);">${Admin.fmtDate(u.created_at)}</td>
      <td>${u.is_banned?'<span class="badge badge-lost">BANNED</span>':'<span class="badge badge-won">Active</span>'}</td>
      <td><button onclick="editUser(${u.id},'${u.name}','${u.role}',${u.is_banned})" class="btn btn-outline btn-sm" style="padding:4px 8px;"><span class="material-icons-round" style="font-size:0.9rem;">edit</span></button></td>
    </tr>`).join('');
  const pages = Math.ceil(d.total/20);
  if (pages>1) {
    document.getElementById('user-pagination').style.display='flex';
    document.getElementById('u-info').textContent='Page '+page+' of '+pages+' ('+d.total+' total)';
    document.getElementById('u-prev').disabled=(page<=1);
    document.getElementById('u-next').disabled=(page>=pages);
  }
}

function editUser(id,name,role,banned) {
  document.getElementById('u-edit-id').value=id;
  document.getElementById('u-edit-name').textContent=name;
  document.getElementById('u-role').value=role;
  document.getElementById('u-banned').checked=!!banned;
  Admin.showModal('user-modal');
}

document.addEventListener('DOMContentLoaded', async () => {
  const user = await Admin.requireAdmin();
  if (!user) return;
  Admin.buildSidebar(user);
  loadUsers(1);
  document.getElementById('apply-filters').addEventListener('click',()=>loadUsers(1));
  document.getElementById('u-prev').addEventListener('click',()=>loadUsers(--userPage));
  document.getElementById('u-next').addEventListener('click',()=>loadUsers(++userPage));
  document.getElementById('save-user-btn').addEventListener('click', async () => {
    const id   = document.getElementById('u-edit-id').value;
    const body = { role: document.getElementById('u-role').value, is_banned: document.getElementById('u-banned').checked };
    const json = await Admin.api('PUT','/api/admin/users/'+id,body);
    if (json.success) { Admin.toast('User updated'); Admin.hideModal('user-modal'); loadUsers(userPage); }
    else Admin.toast(json.message||'Failed','error');
  });
});
</script>
</body></html>
