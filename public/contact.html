<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6753CPHM2B"></script>

  <meta charset="UTF-8"><link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Contact Rooted Predictions — Get in Touch</title>
  <meta name="description" id="page-meta-desc" content="Contact the Rooted Predictions team for support, partnership enquiries, or feedback. We are here to help bettors worldwide win more.">
  <meta name="keywords" content="contact Rooted Predictions, football tips support, Rooted Predictions help">
  <link rel="canonical" href="https://www.rootedpredict.com/contact.html">
  <meta property="og:title" content="Contact Rooted Predictions — Get in Touch">
  <meta property="og:description" content="Contact the Rooted Predictions team for support, partnerships, or feedback. Precision tips. Global reach.">
  <meta property="og:url" content="https://www.rootedpredict.com/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rooted Predictions">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<div style="background:var(--navy);padding:36px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
  <div class="container">
    <nav style="font-size:0.78rem;color:rgba(255,255,255,0.45);display:flex;align-items:center;gap:6px;margin-bottom:12px;">
      <a href="/" style="color:rgba(255,255,255,0.45);">Home</a>
      <span class="material-icons-round" style="font-size:0.8rem;">chevron_right</span>
      <span style="color:rgba(255,255,255,0.7);">Contact</span>
    </nav>
    <h1 id="hero-title" style="font-family:var(--font-head);font-size:2.2rem;font-weight:900;color:#fff;margin-bottom:6px;">Contact Us</h1>
    <p id="hero-subtitle" style="font-size:0.9rem;color:rgba(255,255,255,0.55);">We typically respond within 24 hours</p>
  </div>
</div>
<main>
  <div class="container" style="padding-top:40px;padding-bottom:60px;">
    <div class="mob-1col" style="display:grid;grid-template-columns:1.2fr 1fr;gap:40px;max-width:900px;margin:32px auto 0;">

      <!-- Contact Form (static — no backend needed for display) -->
      <div>
        <h2 style="font-family:var(--font-head);font-size:1.4rem;font-weight:700;margin-bottom:20px;">Send Us a Message</h2>
        <form id="contact-form" novalidate>
          <div class="form-group">
            <label class="form-label">Your Name</label>
            <div class="input-icon-wrap"><span class="material-icons-round">person</span><input type="text" class="form-control" placeholder="Your full name" required></div>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-icon-wrap"><span class="material-icons-round">email</span><input type="email" class="form-control" placeholder="your@email.com" required></div>
          </div>
          <div class="form-group">
            <label class="form-label">Subject</label>
            <select class="form-control">
              <option value="">Select a subject</option>
              <option>General Enquiry</option>
              <option>Technical Issue</option>
              <option>Advertising / Partnership</option>
              <option>Affiliate Programme</option>
              <option>Feedback</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="5" placeholder="Tell us how we can help..." required style="resize:vertical;-webkit-user-select:text;user-select:text;"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="contact-btn">
            <span class="material-icons-round">send</span>Send Message
          </button>
        </form>
        <div id="contact-success" style="display:none;margin-top:16px;padding:14px 16px;background:rgba(22,163,74,0.1);border:1px solid rgba(22,163,74,0.3);border-radius:8px;color:var(--green);font-size:0.875rem;align-items:center;gap:8px;">
          <span class="material-icons-round">check_circle</span>
          Message sent successfully. We will get back to you within 24 hours.
        </div>
      </div>

      <!-- Dynamic contact info panel -->
      <div>
        <h2 style="font-family:var(--font-head);font-size:1.4rem;font-weight:700;margin-bottom:20px;">Other Ways to Reach Us</h2>
        <div id="contact-info-loading" style="color:var(--muted);font-size:0.875rem;padding:20px 0;">Loading...</div>
        <div id="contact-info" style="display:none;flex-direction:column;gap:14px;"></div>
      </div>

    </div>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<script>
document.getElementById('contact-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = document.getElementById('contact-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-icons-round">hourglass_empty</span>Sending...';
  setTimeout(function() {
    document.getElementById('contact-form').style.display = 'none';
    document.getElementById('contact-success').style.display = 'flex';
  }, 1200);
});

(async () => {
  try {
    const res  = await fetch('/api/pages/contact');
    const data = await res.json();
    if (!data.success) throw new Error();
    const p = data.page;

    if (p.page_title)       document.getElementById('page-title').textContent   = p.page_title;
    if (p.meta_description) document.getElementById('page-meta-desc').setAttribute('content', p.meta_description);
    if (p.hero_title)       document.getElementById('hero-title').textContent   = p.hero_title;
    if (p.hero_subtitle)    document.getElementById('hero-subtitle').textContent = p.hero_subtitle;

    const e = p.extra || {};
    const infoEl = document.getElementById('contact-info');

    const items = [
      {
        icon: 'email',
        label: 'Email Support',
        href: e.support_email ? `mailto:${e.support_email}` : null,
        text: e.support_email || '—',
        sub: 'Response within 24 hours',
      },
      {
        icon: 'send',
        label: 'Telegram Community',
        href: e.telegram_url || null,
        text: e.telegram_handle || '—',
        sub: 'Free tips channel',
        external: true,
      },
      {
        icon: 'business',
        label: 'Partnerships & Advertising',
        href: e.partners_email ? `mailto:${e.partners_email}` : null,
        text: e.partners_email || '—',
        sub: 'Affiliate & media enquiries',
      },
    ];

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'card';
      div.style.cssText = 'padding:16px;display:flex;align-items:flex-start;gap:12px;';
      div.innerHTML = `
        <span class="material-icons-round" style="color:var(--red);font-size:1.3rem;flex-shrink:0;margin-top:2px;">${item.icon}</span>
        <div>
          <div style="font-weight:600;font-size:0.9rem;margin-bottom:2px;">${item.label}</div>
          ${item.href
            ? `<a href="${item.href}"${item.external ? ' target="_blank" rel="noopener noreferrer"' : ''} style="font-size:0.85rem;color:var(--muted);">${item.text}</a>`
            : `<span style="font-size:0.85rem;color:var(--muted);">${item.text}</span>`}
          <div style="font-size:0.78rem;color:var(--muted);margin-top:2px;">${item.sub}</div>
        </div>`;
      infoEl.appendChild(div);
    });

    if (e.support_hours_weekday || e.support_hours_weekend) {
      const hoursDiv = document.createElement('div');
      hoursDiv.style.cssText = 'margin-top:10px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);';
      hoursDiv.innerHTML = `
        <div style="font-weight:600;font-size:0.875rem;margin-bottom:6px;display:flex;align-items:center;gap:6px;">
          <span class="material-icons-round" style="font-size:1rem;color:var(--muted);">schedule</span>Support Hours
        </div>
        <p style="font-size:0.82rem;color:var(--muted);line-height:1.7;">${e.support_hours_weekday || ''}<br>${e.support_hours_weekend || ''}</p>`;
      infoEl.appendChild(hoursDiv);
    }

  } catch {
    document.getElementById('contact-info-loading').textContent = 'Contact info unavailable.';
    return;
  }
  document.getElementById('contact-info-loading').style.display = 'none';
  document.getElementById('contact-info').style.display = 'flex';
})();
</script>
</body>
</html>
