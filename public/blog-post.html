<head>

  <meta charset="UTF-8"><link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Article | Rooted Predictions Blog</title>
  <meta name="description" id="page-desc" content="Football betting guide and analysis from Rooted Predictions.">
  <meta name="keywords" id="page-keywords" content="football betting, Rooted Predictions">
  <link rel="canonical" id="page-canonical" href="https://www.rootedpredict.com/blog.html">
  <meta property="og:title" id="og-title" content="Rooted Predictions Blog">
  <meta property="og:description" id="og-desc" content="Football betting guide and analysis.">
  <meta property="og:url" id="og-url" content="https://www.rootedpredict.com/blog.html">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Rooted Predictions">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Blog articles use Open Sans for long-form readability */
    #post-body, #post-body p, #post-body li, #post-body blockquote { font-family: 'Open Sans', sans-serif; }
  </style>
  <script id="article-schema" type="application/ld+json">{}</script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main>
  <div class="container" style="padding-top:28px;max-width:820px;">
    <nav style="font-size:0.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:20px;">
      <a href="/" style="color:var(--muted);">Home</a><span class="material-icons-round" style="font-size:0.8rem;">chevron_right</span>
      <a href="/blog.html" style="color:var(--muted);">Blog</a><span class="material-icons-round" style="font-size:0.8rem;">chevron_right</span>
      <span id="bc-title">Article</span>
    </nav>
    <article id="post-body">
      <div style="padding:60px;text-align:center;color:var(--muted);">
        <span class="material-icons-round" style="font-size:2.5rem;display:block;margin-bottom:8px;animation:spin 1s linear infinite;">article</span>
        Loading article…
      </div>
    </article>
    <div style="margin:32px 0;"><a href="/blog.html" class="btn btn-outline btn-sm"><span class="material-icons-round">arrow_back</span>All Articles</a></div>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
(async () => {
  const body = document.getElementById('post-body');
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function getSlug() {
    const m = location.pathname.match(/\/blog\/([^/?#]+)/);
    if (m) return decodeURIComponent(m[1]);
    return new URLSearchParams(location.search).get('slug') || '';
  }
  const slug = getSlug();
  function notFound(msg){ body.innerHTML = `<div class="card" style="padding:48px;text-align:center;"><span class="material-icons-round" style="font-size:3rem;color:var(--border);display:block;margin-bottom:12px;">search_off</span><p style="color:var(--muted);margin-bottom:16px;">${msg}</p><a href="/blog.html" class="btn btn-outline btn-sm">All Articles</a></div>`; }
  if (!slug) return notFound('No article specified.');

  let p;
  try {
    const res = await fetch('/api/blog/' + encodeURIComponent(slug));
    const json = await res.json();
    if (!json.success || !json.data) return notFound('This article could not be found.');
    p = json.data;
  } catch (e) { return notFound('Could not load this article.'); }

  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : '';
  document.getElementById('bc-title').textContent = p.title;

  // SEO
  const BASE = 'https://www.rootedpredict.com', url = `${BASE}/blog/${p.slug}`;
  document.title = (p.meta_title || p.title) + ' | Rooted Predictions Blog';
  const setMeta = (id,val) => { const el=document.getElementById(id); if(el) el.setAttribute(el.tagName==='LINK'?'href':'content', val); };
  setMeta('page-desc', p.meta_description || p.excerpt || ''); setMeta('page-keywords', p.keywords || '');
  setMeta('page-canonical', url); setMeta('og-title', p.title); setMeta('og-desc', p.meta_description || p.excerpt || ''); setMeta('og-url', url);
  const sc = document.getElementById('article-schema');
  if (sc) sc.textContent = JSON.stringify({ '@context':'https://schema.org','@type':'Article', headline:p.title, datePublished:p.published_at, author:{'@type':'Organization',name:'Rooted Predictions'}, publisher:{'@type':'Organization',name:'Rooted Predictions'}, description:p.meta_description||p.excerpt||'' });

  function renderContent(raw) {
    try {
      const html = (window.marked && marked.parse)
        ? marked.parse(String(raw || ''), { breaks: true, gfm: true })
        : String(raw || '').replace(/\n/g, '<br>');
      return (window.DOMPurify) ? DOMPurify.sanitize(html) : html;
    } catch(e) {
      return String(raw || '').replace(/\n/g, '<br>');
    }
  }

  body.innerHTML = `
    ${p.category ? `<div class="blog-category" style="margin-bottom:12px;">${esc(p.category)}</div>` : ''}
    <h1 style="font-family:var(--font-head);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;color:var(--text);line-height:1.15;margin-bottom:14px;">${esc(p.title)}</h1>
    <div class="blog-card-meta" style="margin-bottom:24px;"><span class="material-icons-round">calendar_today</span>${fmtDate(p.published_at)}${p.author_name?' <span class="material-icons-round">person</span>'+esc(p.author_name):''}</div>
    ${p.featured_image ? `<img src="${p.featured_image}" alt="${esc(p.title)}" style="width:100%;border-radius:var(--radius-lg);margin-bottom:28px;">` : ''}
    <div style="font-size:1.02rem;line-height:1.85;color:var(--text-soft);" class="article-content">${renderContent(p.content)}</div>`;
})();
</script>
</body>
</html>
