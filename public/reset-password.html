  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | Rooted Predictions</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bai+Jamjuree:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bai+Jamjuree:wght@400;600;700&display=swap"></noscript>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round&display=swap"></noscript>

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/" style="text-decoration:none;">
        <img src="/images/logo.png" alt="Rooted Predictions" style="height:72px;width:auto;">
      </a>
    </div>
    <h1 class="auth-title">Set New Password</h1>
    <p class="auth-sub">Enter your new password below</p>

    <div id="invalid-token" style="display:none;text-align:center;padding:20px 0;">
      <span class="material-icons-round" style="font-size:3rem;color:var(--red);display:block;margin-bottom:12px;">link_off</span>
      <p style="font-size:0.9rem;color:var(--text-soft);margin-bottom:16px;">This reset link is invalid or has expired.</p>
      <a href="/forgot-password.html" class="btn btn-primary btn-sm">Request New Link</a>
    </div>

    <div id="success-msg" style="display:none;text-align:center;padding:20px 0;">
      <span class="material-icons-round" style="font-size:3rem;color:var(--green);display:block;margin-bottom:12px;">check_circle</span>
      <p style="font-size:0.9rem;color:var(--text-soft);margin-bottom:16px;">Password reset successfully!</p>
      <a href="/login.html" class="btn btn-primary">Log In Now</a>
    </div>

    <div id="error-msg" style="display:none;background:rgba(233,69,96,0.1);border:1px solid rgba(233,69,96,0.3);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:0.85rem;color:var(--red);align-items:center;gap:8px;">
      <span class="material-icons-round" style="font-size:1rem;">error</span>
      <span id="error-text"></span>
    </div>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="password">New Password</label>
        <div class="input-icon-wrap">
          <span class="material-icons-round">lock_reset</span>
          <input type="password" id="password" name="password" class="form-control"
            placeholder="Min 8 chars, 1 uppercase, 1 number" autocomplete="new-password" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm">Confirm New Password</label>
        <div class="input-icon-wrap">
          <span class="material-icons-round">lock_reset</span>
          <input type="password" id="confirm" name="confirm" class="form-control"
            placeholder="Repeat your new password" autocomplete="new-password" required>
        </div>
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%;justify-content:center;">
        <span class="material-icons-round">lock_reset</span>Reset Password
      </button>
    </form>
  </div>
</div>
<script src="/js/content-protection.js" defer></script>
<script>
  // Extract token from URL query string
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('invalid-token').style.display = 'block';
  }

  document.getElementById('reset-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn     = document.getElementById('submit-btn');
    const errBox  = document.getElementById('error-msg');
    const errText = document.getElementById('error-text');
    errBox.style.display = 'none';

    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    if (password.length < 8) {
      errText.textContent = 'Password must be at least 8 characters.';
      errBox.style.display = 'flex'; return;
    }
    if (password !== confirm) {
      errText.textContent = 'Passwords do not match.';
      errBox.style.display = 'flex'; return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="material-icons-round">hourglass_empty</span>Resetting...';

    try {
      const res  = await fetch('/api/auth/reset-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token, password }),
      });
      const json = await res.json();

      if (json.success) {
        document.getElementById('reset-form').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
      } else {
        errText.textContent = json.message || 'Reset failed. Please request a new link.';
        errBox.style.display = 'flex';
        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons-round">lock_reset</span>Reset Password';
      }
    } catch(err) {
      errText.textContent = 'Network error. Please try again.';
      errBox.style.display = 'flex';
      btn.disabled = false;
      btn.innerHTML = '<span class="material-icons-round">lock_reset</span>Reset Password';
    }
  });
</script>
</body>
</html>
