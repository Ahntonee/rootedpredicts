<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Privacy Policy | Rooted Predictions</title>
  <meta name="description" id="page-meta-desc" content="Read the Rooted Predictions privacy policy. We are committed to protecting your personal data in compliance with GDPR and global data protection standards.">
  <link rel="canonical" href="https://www.rootedpredict.com/privacy.html">
  <meta property="og:title" content="Privacy Policy | Rooted Predictions">
  <meta property="og:description" content="Rooted Predictions is committed to protecting your personal data. Read our full privacy policy and GDPR compliance details.">
  <meta property="og:url" content="https://www.rootedpredict.com/privacy.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rooted Predictions">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<div style="background:var(--navy);padding:36px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
  <div class="container">
    <nav style="font-size:0.78rem;color:rgba(255,255,255,0.45);display:flex;align-items:center;gap:6px;margin-bottom:12px;">
      <a href="/" style="color:rgba(255,255,255,0.45);">Home</a>
      <span class="material-icons-round" style="font-size:0.8rem;">chevron_right</span>
      <span style="color:rgba(255,255,255,0.7);">Privacy Policy</span>
    </nav>
    <h1 id="hero-title" style="font-family:var(--font-head);font-size:2.2rem;font-weight:900;color:#fff;margin-bottom:6px;">Privacy Policy</h1>
    <p id="last-updated" style="font-size:0.9rem;color:rgba(255,255,255,0.55);"></p>
  </div>
</div>
<main>
  <div class="container" style="padding-top:40px;padding-bottom:60px;">
    <div style="max-width:800px;margin:0 auto;">
      <div style="font-size:0.95rem;color:var(--text-soft);line-height:1.9;">

        <div id="page-loading" style="text-align:center;padding:60px 0;color:var(--muted);">
          <span class="material-icons-round" style="font-size:2.5rem;display:block;margin-bottom:12px;animation:spin 1s linear infinite;">autorenew</span>
          Loading...
        </div>
        <div id="page-content" style="display:none;"></div>

      </div>
    </div>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<style>@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }</style>
<script>
(async () => {
  try {
    const res  = await fetch('/api/pages/privacy');
    const data = await res.json();
    if (!data.success) throw new Error();
    const p = data.page;

    if (p.page_title)       document.getElementById('page-title').textContent    = p.page_title;
    if (p.meta_description) document.getElementById('page-meta-desc').setAttribute('content', p.meta_description);
    if (p.hero_title)       document.getElementById('hero-title').textContent    = p.hero_title;
    if (p.last_updated) {
      const d = new Date(p.last_updated);
      document.getElementById('last-updated').textContent = 'Last updated: ' +
        d.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
    }
    if (p.content) document.getElementById('page-content').innerHTML = p.content;
  } catch {
    document.getElementById('page-loading').innerHTML = '<p style="color:var(--muted)">Content unavailable.</p>';
    return;
  }
  document.getElementById('page-loading').style.display  = 'none';
  document.getElementById('page-content').style.display  = 'block';
})();
</script>
</body>
</html>
