<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">About Rooted Predictions — Global Football Prediction Platform</title>
  <meta name="description" id="page-meta-desc" content="Rooted Predictions is a global football prediction platform serving free and VIP tips powered by algorithm-generated predictions and API-Football data covering 1,200+ leagues worldwide.">
  <meta name="keywords" content="about Rooted Predictions, football prediction platform, best tipster site, who makes football predictions, algorithm football tips, data driven football predictions, football prediction company, trusted football tipster, most accurate prediction site, football prediction website, reliable football tips, how football predictions work, football AI predictions, global football tips platform, free and VIP football tips, 1200 leagues predictions, football tipster UK, football tipster Nigeria, football tipster India">
  <link rel="canonical" href="https://www.rootedpredict.com/about.html">
  <meta property="og:title" content="About Rooted Predictions — Global Football Prediction Platform">
  <meta property="og:description" content="Algorithm-powered football predictions covering 1,200+ leagues. Free and VIP tips for bettors worldwide.">
  <meta property="og:url" content="https://www.rootedpredict.com/about.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rooted Predictions">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<!-- Hero -->
<div style="background:linear-gradient(135deg,var(--navy),var(--midnight));padding:60px 0;text-align:center;">
  <div class="container">
    <div class="hero-tag" style="justify-content:center;margin-bottom:16px;"><span class="material-icons-round">info</span>About Us</div>
    <h1 id="hero-title" style="font-family:var(--font-head);font-size:clamp(2.2rem,5vw,3.5rem);font-weight:900;color:#fff;margin-bottom:14px;">Built for Bettors. Powered by Data.</h1>
    <p id="hero-subtitle" style="font-size:1.05rem;color:rgba(255,255,255,0.6);max-width:580px;margin:0 auto;">Rooted Predictions is a global football prediction platform covering 1,200+ leagues, serving free and VIP tips to over 50,000 members worldwide.</p>
  </div>
</div>

<main>
  <div class="container" style="padding-top:48px;padding-bottom:60px;max-width:900px;">

    <!-- Loading skeleton -->
    <div id="page-loading" style="text-align:center;padding:60px 0;color:var(--muted);">
      <span class="material-icons-round" style="font-size:2.5rem;display:block;margin-bottom:12px;animation:spin 1s linear infinite;">autorenew</span>
      Loading page content...
    </div>

    <!-- Dynamic content injected here -->
    <div id="page-content" style="display:none;"></div>

    <!-- Stats banner (populated from DB extra fields) -->
    <div id="stats-banner" style="display:none;background:linear-gradient(135deg,var(--navy),var(--midnight));border-radius:var(--radius-lg);padding:40px;margin-bottom:48px;text-align:center;">
      <h2 style="font-family:var(--font-head);font-size:1.8rem;font-weight:800;color:#fff;margin-bottom:28px;">Rooted Predictions by the Numbers</h2>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;">
        <div><div id="stat-accuracy" style="font-family:var(--font-head);font-size:2.4rem;font-weight:900;color:var(--red);"></div><div id="stat-accuracy-label" style="font-size:0.78rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;"></div></div>
        <div><div id="stat-leagues" style="font-family:var(--font-head);font-size:2.4rem;font-weight:900;color:var(--red);"></div><div id="stat-leagues-label" style="font-size:0.78rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;"></div></div>
        <div><div id="stat-members" style="font-family:var(--font-head);font-size:2.4rem;font-weight:900;color:var(--red);"></div><div id="stat-members-label" style="font-size:0.78rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;"></div></div>
        <div><div id="stat-countries" style="font-family:var(--font-head);font-size:2.4rem;font-weight:900;color:var(--red);"></div><div id="stat-countries-label" style="font-size:0.78rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;"></div></div>
      </div>
    </div>

  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<style>@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }</style>
<script>
(async () => {
  try {
    const res  = await fetch('/api/pages/about');
    const data = await res.json();
    if (!data.success) throw new Error('Not found');
    const p = data.page;

    // Update meta
    if (p.page_title)       document.getElementById('page-title').textContent     = p.page_title;
    if (p.meta_description) document.getElementById('page-meta-desc').setAttribute('content', p.meta_description);
    if (p.hero_title)       document.getElementById('hero-title').textContent     = p.hero_title;
    if (p.hero_subtitle)    document.getElementById('hero-subtitle').textContent  = p.hero_subtitle;

    // Inject main content
    if (p.content) {
      document.getElementById('page-content').innerHTML = p.content;
    }

    // Stats banner
    if (p.extra) {
      const e = p.extra;
      document.getElementById('stat-accuracy').textContent        = e.stat_accuracy        || '';
      document.getElementById('stat-accuracy-label').textContent  = e.stat_accuracy_label  || '';
      document.getElementById('stat-leagues').textContent         = e.stat_leagues          || '';
      document.getElementById('stat-leagues-label').textContent   = e.stat_leagues_label    || '';
      document.getElementById('stat-members').textContent         = e.stat_members          || '';
      document.getElementById('stat-members-label').textContent   = e.stat_members_label    || '';
      document.getElementById('stat-countries').textContent       = e.stat_countries        || '';
      document.getElementById('stat-countries-label').textContent = e.stat_countries_label  || '';
      document.getElementById('stats-banner').style.display = 'block';
    }

  } catch (e) {
    document.getElementById('page-loading').innerHTML = '<p style="color:var(--muted)">Content unavailable.</p>';
    return;
  }

  document.getElementById('page-loading').style.display = 'none';
  document.getElementById('page-content').style.display = 'block';
})();
</script>
</body>
</html>
