<script>
(function () {
  const content = document.getElementById('blog-content');
  const ICONS = { 'Match Preview':'sports_soccer','Betting Guide':'school','League Analysis':'analytics','Tips Strategy':'lightbulb','Sport Talk':'forum' };
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
  const thumb = (p, h) => p.featured_image
    ? `<div style="height:${h}px;background:#0b2a1a url('${p.featured_image}') center/cover no-repeat;"></div>`
    : `<div style="height:${h}px;background:linear-gradient(135deg,var(--navy),var(--midnight));display:flex;align-items:center;justify-content:center;"><span class="material-icons-round" style="font-size:${h>200?'4rem':'3rem'};color:rgba(26,138,68,0.4);">${ICONS[p.category]||'article'}</span></div>`;

  function render(posts) {
    if (!posts.length) {
      content.innerHTML = `<div class="card" style="padding:48px;text-align:center;"><span class="material-icons-round" style="font-size:3rem;color:var(--border);display:block;margin-bottom:12px;">article</span><p style="color:var(--muted);">No articles published yet. Check back soon!</p></div>`;
      return;
    }
    const [feat, ...rest] = posts;
    let html = `
      <a href="/blog/${feat.slug}" style="text-decoration:none;"><div class="card mob-1col" style="display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:32px;overflow:hidden;">
        ${thumb(feat, 280)}
        <div style="padding:28px;">
          <div class="blog-category">Featured${feat.category?' · '+esc(feat.category):''}</div>
          <h2 style="font-family:var(--font-head);font-size:1.6rem;font-weight:800;color:var(--text);margin-bottom:10px;line-height:1.2;">${esc(feat.title)}</h2>
          <p style="font-size:0.875rem;color:var(--muted);line-height:1.7;margin-bottom:16px;">${esc(feat.excerpt||'')}</p>
          <div class="blog-card-meta" style="margin-bottom:16px;"><span class="material-icons-round">calendar_today</span>${fmtDate(feat.published_at)}${feat.author_name?' <span class="material-icons-round">person</span>'+esc(feat.author_name):''}</div>
          <span class="btn btn-primary btn-sm"><span class="material-icons-round">article</span>Read Article</span>
        </div>
      </div></a>`;
    if (rest.length) {
      html += `<div class="blog-grid" style="margin-bottom:32px;">` + rest.map(p => `
        <a href="/blog/${p.slug}" class="blog-card" style="text-decoration:none;">
          ${thumb(p, 180)}
          <div class="blog-card-body"><div class="blog-category">${esc(p.category||'Article')}</div><h3 class="blog-card-title">${esc(p.title)}</h3><p class="blog-card-excerpt">${esc(p.excerpt||'')}</p><div class="blog-card-meta"><span class="material-icons-round">calendar_today</span>${fmtDate(p.published_at)}</div></div>
        </a>`).join('') + `</div>`;
    }
    content.innerHTML = html;
  }

  async function load(category) {
    content.innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted);"><span class="material-icons-round" style="font-size:2.5rem;display:block;margin-bottom:8px;animation:spin 1s linear infinite;">article</span>Loading…</div>`;
    try {
      const res = await fetch('/api/blog?limit=30' + (category ? '&category=' + encodeURIComponent(category) : ''));
      const json = await res.json();
      render((json.success && json.data && json.data.posts) ? json.data.posts : []);
    } catch (e) {
      content.innerHTML = `<div class="card" style="padding:48px;text-align:center;color:var(--muted);">Could not load articles. <a href="javascript:location.reload()" style="color:var(--green);">Retry</a></div>`;
    }
  }

  document.querySelectorAll('#blog-cats .market-tab').forEach(tab => {
    tab.addEventListener('click', function () {
      document.querySelectorAll('#blog-cats .market-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      load(this.dataset.cat);
    });
  });
  load('');
})();
</script>
