<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bet History &amp; Tracker | Rooted Predictions</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main>
  <div class="container" style="padding-top:32px;padding-bottom:60px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
      <div>
        <nav style="font-size:0.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px;"><a href="/dashboard.html" style="color:var(--muted);">Dashboard</a><span class="material-icons-round" style="font-size:0.8rem;">chevron_right</span><span>Bet History</span></nav>
        <h1 style="font-family:var(--font-head);font-size:1.8rem;font-weight:800;color:var(--text);">Bet History &amp; Tracker</h1>
      </div>
      <button class="btn btn-primary" id="add-bet-btn"><span class="material-icons-round">add</span>Log a Bet</button>
    </div>

    <!-- Summary stats -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;">
      <div class="card" style="padding:16px;text-align:center;"><div style="font-family:var(--font-head);font-size:1.8rem;font-weight:800;color:var(--text);" id="total-bets">0</div><div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;">Total Bets</div></div>
      <div class="card" style="padding:16px;text-align:center;"><div style="font-family:var(--font-head);font-size:1.8rem;font-weight:800;color:var(--green);" id="total-won">0</div><div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;">Won</div></div>
      <div class="card" style="padding:16px;text-align:center;"><div style="font-family:var(--font-head);font-size:1.8rem;font-weight:800;color:var(--red);" id="total-lost">0</div><div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;">Lost</div></div>
      <div class="card" style="padding:16px;text-align:center;"><div style="font-family:var(--font-head);font-size:1.8rem;font-weight:800;color:var(--green);" id="total-pl">$0.00</div><div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;">Profit / Loss</div></div>
    </div>

    <!-- Add bet form (hidden by default) -->
    <div id="add-bet-form" style="display:none;" class="card" style="padding:24px;margin-bottom:20px;">
      <div style="padding:24px;">
        <h3 style="font-family:var(--font-head);font-size:1.1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;"><span class="material-icons-round" style="color:var(--red);">add_circle</span>Log New Bet</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Match / Description</label>
            <input type="text" class="form-control" id="bet-match" placeholder="e.g. Arsenal vs Chelsea">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Tip / Selection</label>
            <input type="text" class="form-control" id="bet-tip" placeholder="e.g. Arsenal Win">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Stake (USD)</label>
            <input type="number" class="form-control" id="bet-stake" placeholder="0.00" min="0" step="0.01">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Odds</label>
            <input type="number" class="form-control" id="bet-odds" placeholder="1.85" min="1" step="0.01">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Result</label>
            <select class="form-control" id="bet-result">
              <option value="pending">Pending</option>
              <option value="won">Won</option>
              <option value="lost">Lost</option>
              <option value="void">Void</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Notes (optional)</label>
            <input type="text" class="form-control" id="bet-notes" placeholder="Any notes...">
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;">
          <button class="btn btn-primary" id="save-bet-btn"><span class="material-icons-round">save</span>Save Bet</button>
          <button class="btn btn-outline" id="cancel-bet-btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Bets table -->
    <div class="card" style="overflow:hidden;">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
        <h2 style="font-family:var(--font-head);font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px;"><span class="material-icons-round" style="color:var(--red);">receipt_long</span>All Bets</h2>
      </div>
      <div id="bets-table-wrap">
        <div style="text-align:center;padding:60px 24px;">
          <span class="material-icons-round" style="font-size:3rem;color:var(--border);display:block;margin-bottom:10px;">receipt_long</span>
          <p style="font-size:0.875rem;color:var(--muted);margin-bottom:16px;">No bets logged yet. Click "Log a Bet" to start tracking your results.</p>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('add-bet-btn').click()"><span class="material-icons-round">add</span>Log First Bet</button>
        </div>
      </div>
    </div>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<script>
// Local bet tracker (persists to localStorage until Phase 5 wires it to the API)
const BETS_KEY = 'rp_bets';
let bets = JSON.parse(localStorage.getItem(BETS_KEY) || '[]');

function saveBets() { localStorage.setItem(BETS_KEY, JSON.stringify(bets)); }

function renderStats() {
  const won = bets.filter(b => b.result === 'won').length;
  const lost = bets.filter(b => b.result === 'lost').length;
  const pl = bets.reduce((sum, b) => {
    if (b.result === 'won') return sum + (parseFloat(b.stake) * parseFloat(b.odds) - parseFloat(b.stake));
    if (b.result === 'lost') return sum - parseFloat(b.stake);
    return sum;
  }, 0);
  document.getElementById('total-bets').textContent = bets.length;
  document.getElementById('total-won').textContent = won;
  document.getElementById('total-lost').textContent = lost;
  const plEl = document.getElementById('total-pl');
  plEl.textContent = (pl >= 0 ? '+' : '') + '$' + pl.toFixed(2);
  plEl.style.color = pl >= 0 ? 'var(--green)' : 'var(--red)';
}

function renderTable() {
  const wrap = document.getElementById('bets-table-wrap');
  if (!bets.length) { wrap.innerHTML = '<div style="text-align:center;padding:60px 24px;"><span class="material-icons-round" style="font-size:3rem;color:var(--border);display:block;margin-bottom:10px;">receipt_long</span><p style="font-size:0.875rem;color:var(--muted);">No bets logged yet.</p></div>'; return; }
  wrap.innerHTML = '<table class="leaderboard-table"><thead><tr><th>Match</th><th>Tip</th><th>Stake</th><th>Odds</th><th>Result</th><th>P&amp;L</th><th></th></tr></thead><tbody>' +
    bets.map((b, i) => {
      const pl = b.result === 'won' ? (b.stake * b.odds - b.stake).toFixed(2) : b.result === 'lost' ? (-b.stake).toFixed(2) : '—';
      const plColor = b.result === 'won' ? 'var(--green)' : b.result === 'lost' ? 'var(--red)' : 'var(--muted)';
      const badge = b.result === 'won' ? '<span class="badge badge-won"><span class="material-icons-round">check_circle</span>WON</span>' :
                    b.result === 'lost' ? '<span class="badge badge-lost"><span class="material-icons-round">cancel</span>LOST</span>' :
                    '<span class="badge badge-pending">PENDING</span>';
      return `<tr><td><strong>${b.match}</strong></td><td>${b.tip}</td><td>$${parseFloat(b.stake).toFixed(2)}</td><td>${b.odds}</td><td>${badge}</td><td style="font-weight:700;color:${plColor};">${pl !== '—' ? (parseFloat(pl) >= 0 ? '+' : '') + '$' + pl : pl}</td><td><button onclick="deleteBet(${i})" style="background:none;border:none;cursor:pointer;color:var(--muted);"><span class="material-icons-round" style="font-size:1rem;">delete</span></button></td></tr>`;
    }).join('') + '</tbody></table>';
}

function deleteBet(i) { if (confirm('Remove this bet?')) { bets.splice(i, 1); saveBets(); renderStats(); renderTable(); } }

document.getElementById('add-bet-btn').addEventListener('click', () => {
  const form = document.getElementById('add-bet-form');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('cancel-bet-btn').addEventListener('click', () => { document.getElementById('add-bet-form').style.display = 'none'; });
document.getElementById('save-bet-btn').addEventListener('click', () => {
  const match = document.getElementById('bet-match').value.trim();
  const tip = document.getElementById('bet-tip').value.trim();
  const stake = parseFloat(document.getElementById('bet-stake').value);
  const odds = parseFloat(document.getElementById('bet-odds').value);
  const result = document.getElementById('bet-result').value;
  if (!match || !tip || isNaN(stake) || stake <= 0 || isNaN(odds) || odds < 1) { alert('Please fill in all required fields correctly.'); return; }
  bets.unshift({ match, tip, stake, odds, result, notes: document.getElementById('bet-notes').value, date: new Date().toISOString() });
  saveBets(); renderStats(); renderTable();
  document.getElementById('add-bet-form').style.display = 'none';
  ['bet-match','bet-tip','bet-stake','bet-odds','bet-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('bet-result').value = 'pending';
});

renderStats(); renderTable();
</script>
</body>
</html>
