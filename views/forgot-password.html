<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Rooted Predictions</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/index.html" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;">
        <span class="logo-mark">RP</span>
        <span class="logo-text" style="color:var(--text);">AFRO<span style="color:var(--red);">PREDICT</span></span>
      </a>
    </div>
    <h1 class="auth-title">Forgot Password</h1>
    <p class="auth-sub">Enter your email and we'll send a reset link</p>

    <div id="success-msg" style="display:none;background:rgba(22,163,74,0.1);border:1px solid rgba(22,163,74,0.3);border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:0.875rem;color:var(--green);align-items:center;gap:10px;">
      <span class="material-icons-round">check_circle</span>
      <span>If that email is registered, a reset link has been sent. Check your inbox.</span>
    </div>

    <div id="error-msg" style="display:none;background:rgba(233,69,96,0.1);border:1px solid rgba(233,69,96,0.3);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:0.85rem;color:var(--red);align-items:center;gap:8px;">
      <span class="material-icons-round" style="font-size:1rem;">error</span>
      <span id="error-text"></span>
    </div>

    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-icon-wrap">
          <span class="material-icons-round">email</span>
          <input type="email" id="email" name="email" class="form-control"
            placeholder="your@email.com" autocomplete="email" required>
        </div>
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%;justify-content:center;">
        <span class="material-icons-round">send</span>Send Reset Link
      </button>
    </form>

    <div class="auth-footer" style="margin-top:20px;">
      <a href="/login.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:0.875rem;">
        <span class="material-icons-round" style="font-size:1rem;">arrow_back</span>Back to Login
      </a>
    </div>
  </div>
</div>
<script src="/js/content-protection.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn      = document.getElementById('submit-btn');
    const errBox   = document.getElementById('error-msg');
    const errText  = document.getElementById('error-text');
    const succBox  = document.getElementById('success-msg');

    errBox.style.display  = 'none';
    succBox.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="material-icons-round">hourglass_empty</span>Sending...';

    try {
      const res  = await fetch('/api/auth/forgot-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email: document.getElementById('email').value.trim() }),
      });
      const json = await res.json();

      if (json.success) {
        succBox.style.display = 'flex';
        document.getElementById('forgot-form').style.display = 'none';
      } else {
        errText.textContent = json.message || 'Request failed. Please try again.';
        errBox.style.display = 'flex';
        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons-round">send</span>Send Reset Link';
      }
    } catch(err) {
      errText.textContent = 'Network error. Please try again.';
      errBox.style.display = 'flex';
      btn.disabled = false;
      btn.innerHTML = '<span class="material-icons-round">send</span>Send Reset Link';
    }
  });
</script>
</body>
</html>
